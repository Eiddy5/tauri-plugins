[package]
name = "tauri-plugin-screenshot"
version = "0.1.0"
authors = ["You"]
description = "Native area screenshot plugin for Tauri 2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-screenshot"

[package.metadata.platforms.support]
windows = { level = "full", notes = "Windows 10/11" }
macos = { level = "full", notes = "macOS 15.2 or later" }
linux = { level = "none", notes = "Not supported" }
android = { level = "none", notes = "Not supported" }
ios = { level = "none", notes = "Not supported" }

[dependencies]
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSBezierPath",
  "NSColor",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSImageRep",
  "NSPanel",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFData",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGDirectDisplay",
  "CGError",
  "CGEvent",
  "CGEventTypes",
  "CGGeometry",
  "CGImage",
  "CGWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSError",
  "NSGeometry",
  "NSObject",
  "NSString",
] }
objc2-image-io = { version = "0.3", default-features = false, features = [
  "std",
  "CGImageDestination",
  "objc2-core-graphics",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
  "std",
  "SCScreenshotManager",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
