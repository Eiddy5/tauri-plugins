[package]
name = "tauri-app"
version = "0.1.0"
description = "Angular capability lab for tauri-plugin-mcp"
authors = ["zhuangjianqi"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-mcp = { path = "../../.." }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
